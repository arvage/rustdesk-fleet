<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — RustDesk Fleet</title>
  <script nonce="{{ request.state.csp_nonce }}">
  // Theme: 'light' | 'dark' | 'system' (follows the OS), saved per browser.
  // Runs before the page paints so dark mode doesn't flash white.
  (function () {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function apply() {
      var t = localStorage.getItem('rdf-theme') || 'system';
      document.documentElement.dataset.theme = (t === 'dark' || (t === 'system' && mq.matches)) ? 'dark' : 'light';
    }
    apply();
    mq.addEventListener('change', apply);
    window.rdfApplyTheme = apply;
  })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v=9">
  <script src="/static/app.js?v=2" defer></script>
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="login-logo">
      <div class="brand-icon">R</div>
      <div>
        <span class="brand-name">RustDesk Fleet</span>
        <span class="brand-sub">Management Console</span>
      </div>
    </div>
    <h2>Welcome back</h2>
    <p>Sign in to manage your fleet.</p>
    {% if just_setup %}
    <div class="flash success" style="margin-bottom:16px">Account created — sign in below.</div>
    {% endif %}
    {% if error %}<div class="flash error" style="margin-bottom:16px">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="login-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autofocus required
               placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               placeholder="Your password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
    <a href="/" class="btn btn-ghost" style="margin-top:10px">Back to home page</a>
  </div>
</div>
</body>
</html>
