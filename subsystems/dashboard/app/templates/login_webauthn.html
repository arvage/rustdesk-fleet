<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in with a passkey — RustDesk Fleet</title>
  <script nonce="{{ request.state.csp_nonce }}">
  // Theme: 'light' | 'dark' | 'system' (follows the OS), saved per browser.
  // Runs before the page paints so dark mode doesn't flash white.
  (function () {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function apply() {
      var t = localStorage.getItem('rdf-theme') || 'system';
      document.documentElement.dataset.theme = (t === 'dark' || (t === 'system' && mq.matches)) ? 'dark' : 'light';
    }
    apply();
    mq.addEventListener('change', apply);
    window.rdfApplyTheme = apply;
  })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v=9">
  <script src="/static/app.js?v=2" defer></script>
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="login-logo">
      <div class="brand-icon">R</div>
      <div>
        <span class="brand-name">RustDesk Fleet</span>
        <span class="brand-sub">Management Console</span>
      </div>
    </div>
    <h2>Confirm it's you</h2>
    <p id="status-text">Use your passkey to finish signing in.</p>
    <div id="error-box" class="flash error" style="margin-bottom:16px;display:none"></div>
    <button id="retry-btn" class="btn btn-primary" style="width:100%;display:none">Try again</button>
    <p style="margin-top:16px"><a href="/login">Back to sign in</a></p>
  </div>
</div>
<script nonce="{{ request.state.csp_nonce }}">
function b64urlToBuf(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
function bufToB64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// On a custom domain, passkeys belong to the account's own host. Browsers
// without WebAuthn Related Origin Requests can't use them here: sign in on
// that host instead, which sends you back signed in (app/handoff.py).
const HANDOFF = {% if passkey_home(request) %}"https://{{ passkey_home(request) }}/login/handoff/start?to={{ tenant_of(request).hostname | urlencode }}"{% else %}""{% endif %};

async function relatedOriginsUnsupported() {
  try {
    if (PublicKeyCredential.getClientCapabilities) {
      const caps = await PublicKeyCredential.getClientCapabilities();
      return caps.relatedOrigins === false;
    }
  } catch (e) {}
  return false;     // unknown: try, and hand off on a SecurityError
}

function handOff() {
  document.getElementById('status-text').textContent = 'Taking you to sign in with your passkey…';
  window.location.href = HANDOFF;
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
  document.getElementById('status-text').style.display = 'none';
  document.getElementById('retry-btn').style.display = 'block';
}

async function runCeremony() {
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('retry-btn').style.display = 'none';
  document.getElementById('status-text').style.display = 'block';

  if (!window.PublicKeyCredential) {
    showError('This browser does not support passkeys/security keys.');
    return;
  }

  if (HANDOFF && await relatedOriginsUnsupported()) {
    handOff();
    return;
  }

  try {
    const beginResp = await fetch('/login/webauthn/begin', { method: 'POST' });
    const options = await beginResp.json();
    if (!beginResp.ok) throw new Error(options.error || 'Could not start passkey sign-in.');

    options.challenge = b64urlToBuf(options.challenge);
    if (options.allowCredentials) {
      options.allowCredentials = options.allowCredentials.map(c => ({ ...c, id: b64urlToBuf(c.id) }));
    }

    const cred = await navigator.credentials.get({ publicKey: options });

    const payload = {
      id: cred.id,
      rawId: bufToB64url(cred.rawId),
      type: cred.type,
      response: {
        clientDataJSON: bufToB64url(cred.response.clientDataJSON),
        authenticatorData: bufToB64url(cred.response.authenticatorData),
        signature: bufToB64url(cred.response.signature),
        userHandle: cred.response.userHandle ? bufToB64url(cred.response.userHandle) : null,
      },
    };

    const completeResp = await fetch('/login/webauthn/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const result = await completeResp.json();
    if (!completeResp.ok || !result.ok) throw new Error(result.error || 'Could not verify passkey.');

    window.location.href = result.next || '/';
  } catch (err) {
    if (HANDOFF && err.name === 'SecurityError') {
      handOff();
      return;
    }
    showError(err.message || 'Passkey sign-in failed.');
  }
}

document.getElementById('retry-btn').addEventListener('click', runCeremony);
runCeremony();
</script>
</body>
</html>
